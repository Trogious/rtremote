name: minimum tests (API version)

on: [push]

env:
  RTORRENT_VERSION: v0.16.22

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - name: cache rtorrent
      id: cache-rtorrent
      uses: actions/cache@v4
      with:
        path: ~/rtorrent-prefix
        key: rtorrent-${{env.RTORRENT_VERSION}}-${{runner.os}}-1
    - name: build rtorrent
      if: steps.cache-rtorrent.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool pkg-config libssl-dev zlib1g-dev libcurl4-openssl-dev libncurses-dev
        git clone --depth 1 --branch $RTORRENT_VERSION https://github.com/rakshasa/libtorrent.git $HOME/libtorrent-src
        cd $HOME/libtorrent-src
        autoreconf -ivf
        ./configure --prefix=$HOME/rtorrent-prefix
        make -j$(nproc)
        make install
        git clone --depth 1 --branch $RTORRENT_VERSION https://github.com/rakshasa/rtorrent.git $HOME/rtorrent-src
        cd $HOME/rtorrent-src
        autoreconf -ivf
        PKG_CONFIG_PATH=$HOME/rtorrent-prefix/lib/pkgconfig ./configure --prefix=$HOME/rtorrent-prefix --with-xmlrpc-tinyxml2
        make -j$(nproc)
        make install
    - name: run tests
      env:
        PYTHONPATH: .
        RTR_SCGI_SOCKET_PATH: ./.rtorrent.sock
        RTR_SYSTEM_CLIENT_VERSION: 0.16.22
        RTR_SYSTEM_API_VERSION: 26
      run: |
        mkdir -p dl
        $HOME/rtorrent-prefix/bin/rtorrent -n -o system.daemon.set=true -o directory.default.set=$PWD/dl -o network.scgi.open_local=./.rtorrent.sock &
        pytest ./test/api_version_test.py
        kill -9 `pidof rtorrent`
